<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSTEP Learning Tracker</title>
<meta name="description" content="Theo dõi lộ trình học Operating Systems: Three Easy Pieces trong 12 tuần.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">OSTEP</span>
      <span class="brand-text">Learning Tracker</span>
    </a>
    <div class="topbar-progress" id="topProgress" aria-live="polite"></div>
    <div class="topbar-actions">
      <button type="button" class="btn" id="exportBtn" title="Tải tiến độ về file JSON">Export</button>
      <button type="button" class="btn" id="importBtn" title="Nạp tiến độ từ file JSON">Import</button>
      <input type="file" id="importInput" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<main id="app">
  <p class="loading">Đang tải lộ trình…</p>
</main>

<footer class="footer">
  <span>12 tuần · 5–7 giờ/tuần · dữ liệu lưu trong <code>localStorage</code> của trình duyệt</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
